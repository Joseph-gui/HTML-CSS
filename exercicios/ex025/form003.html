<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>teste de formulário</h1>
    <form action="cadastro.php" method="POST" autocomplete="on">
    <p>
        <label for="inome">Nome:</label>
        <input type="text" name="nome" id="inome" required maxlength="30" autocomplete="name" placeholder="Nome completo">
    </p>
    <p>
        <label for="imedia">Média</label>
        <input type="number" name="media" id="imedia" min="0" max="10" required placeholder="0 a 10" step="0.1">
    </p>
    <p>
        <label for="imes">Periódo letivo</label>
        <input type="month" name="mes" id="imes">
    </p>
    <p>
        <label for="idia">Data</label>
        <input type="date" name="dia" id="idia">
    </p>
    <p>
        <label for="ihora">Hora da prova:</label>
        <input type="time" name="hora" id="ihora">
    </p>
    <p>
        <input type="submit" value="enviar">
        <input type="reset" value="limpar">
    </p>
    </form>
</body>
</html>
