<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="iesmas"> <label for="iesmas">Masculino</label> 
            <input type="radio" name="sexo" id="iesfem"> <label for="iesfem">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes preferidos</legend>
            <input type="checkbox" name="esbas" id="iesbas"> <label for="iesbas">Basquete</label> <br>
            <input type="checkbox" name="esfut" id="iesfut"> <label for="iesfut">Futebol</label> <br>
            <input type="checkbox" name="esnat" id="iesnat"> <label for="iesnat">Natação</label> <br>
            <input type="checkbox" name="esten" id="iesten" checked> <label for="iesten">Tênis</label> <br>
            </fieldset>

        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
    </form>
</body>
</html>
